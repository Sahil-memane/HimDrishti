version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: himdrishti
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: "HimDrishti_Admin!"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/himdrishti
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres

  model1:
    build: ./backend/model1-seaice-service
    ports:
      - "8001:8001"

  model2:
    build: ./backend/model2-iceberg-service
    ports:
      - "8002:8002"

  model3:
    build: ./backend/model3-routing-service
    ports:
      - "8003:8003"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN}

volumes:
  pgdata:
