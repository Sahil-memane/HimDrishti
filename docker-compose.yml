services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: himdrishti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@himdrishti.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-root}@postgres:5432/himdrishti
      - JWT_SECRET=${JWT_SECRET:-a484fb64a98505b75edc6515ed2e59774a6f5f819b3692026077395f30577398}
      - MODEL1_URL=http://model1:8001
      - MODEL2_URL=http://model2:8002
      - MODEL3_URL=http://model3:8003
    depends_on:
      postgres:
        condition: service_healthy
      model1:
        condition: service_healthy
      model2:
        condition: service_healthy
      model3:
        condition: service_healthy

  model1:
    build: ./backend/model1-seaice-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-root}@postgres:5432/himdrishti
    volumes:
      - ./ml/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    # model1's startup (TensorFlow import + real LSTM model load) takes several
    # seconds — noticeably longer than api-gateway's. Without this, a voyage
    # created moments after `docker compose up` can hit api-gateway -> model1
    # while model1's port isn't accepting connections yet, permanently
    # starving that voyage of sea-ice forecast data (observed in practice:
    # a real ECONNREFUSED during pipeline startup).
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=3).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  model2:
    build: ./backend/model2-iceberg-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-root}@postgres:5432/himdrishti
    volumes:
      - ./ml/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=3).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  model3:
    build: ./backend/model3-routing-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-root}@postgres:5432/himdrishti
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8003/health', timeout=3).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  pgdata:
