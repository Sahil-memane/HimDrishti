server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — unknown paths fall back to
    # index.html instead of a raw 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx:1.27-alpine's stock mime.types has no entry for .mjs, so it
    # falls back to application/octet-stream — a browser strictly refuses
    # to run ANY JavaScript module script (a `type="module"` <script>,
    # a dynamic `import()`, or a `new Worker(url, {type:'module'})`) served
    # with a non-JS MIME type, no exception thrown to the app, just a
    # silent load failure. maplibre-gl's map-data worker is one such
    # module (maplibre-gl-worker.mjs, copied into assets/ by
    # vite.config.ts's build plugin) — without it, the base raster
    # tiles still render fine (they don't need it), but every one of the
    # app's own GeoJSON-driven overlays (route line, vessel/waypoint
    # markers, risk zones, sea-ice, icebergs) silently never draws,
    # because the worker that processes that vector data can't start.
    # This regex location outranks the plain /assets/ prefix block above
    # for .mjs specifically, regardless of order (nginx always tries
    # regex locations first bar an exact match).
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
